name: Refresh creative frames

on:
  workflow_dispatch:
      inputs:
            track_name:
                    description: Track name to refresh
                            required: true
                                    type: string

                                    permissions:
                                      contents: write

                                      concurrency:
                                        group: creative-frame-writer
                                          cancel-in-progress: false

                                          jobs:
                                            refresh:
                                                runs-on: ubuntu-latest
                                                    timeout-minutes: 60
                                                        steps:
                                                              - name: Checkout repository
                                                                      uses: actions/checkout@v4
                                                                              with:
                                                                                        fetch-depth: 0

                                                                                              - name: Install FFmpeg
                                                                                                      run: sudo apt-get update && sudo apt-get install -y ffmpeg
                                                                                                      
                                                                                                            - name: Generate frame manifest
                                                                                                                    env:
                                                                                                                              TRACK_NAME: ${{ inputs.track_name }}
                                                                                                                                      run: python3 tools/refresh_uploaded_frames.py prepare --track "$TRACK_NAME" --work-dir /tmp/frame-refresh
                                                                                                                                      
                                                                                                                                            - name: Apply frames to latest data
                                                                                                                                                    env:
                                                                                                                                                              TRACK_NAME: ${{ inputs.track_name }}
                                                                                                                                                                      run: |
                                                                                                                                                                                git pull --rebase origin main
                                                                                                                                                                                          python3 tools/refresh_uploaded_frames.py apply --track "$TRACK_NAME" --work-dir /tmp/frame-refresh
                                                                                                                                                                                          
                                                                                                                                                                                                - name: Commit and push
                                                                                                                                                                                                        env:
                                                                                                                                                                                                                  TRACK_NAME: ${{ inputs.track_name }}
                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                    if git diff --quiet -- site/data/creative.js site/assets/frames; then
                                                                                                                                                                                                                                                echo "No frame changes"
                                                                                                                                                                                                                                                            exit 0
                                                                                                                                                                                                                                                                      fi
                                                                                                                                                                                                                                                                                git config user.name "github-actions[bot]"
                                                                                                                                                                                                                                                                                          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                                                                                                                                                    git add site/data/creative.js site/assets/frames
                                                                                                                                                                                                                                                                                                              git commit -m "frames: 后台刷新「${TRACK_NAME}」关键帧"
                                                                                                                                                                                                                                                                                                                        for attempt in 1 2 3 4; do
                                                                                                                                                                                                                                                                                                                                    if git push origin HEAD:main; then exit 0; fi
                                                                                                                                                                                                                                                                                                                                                git pull --rebase origin main
                                                                                                                                                                                                                                                                                                                                                            sleep $((attempt * 3))
                                                                                                                                                                                                                                                                                                                                                                      done
                                                                                                                                                                                                                                                                                                                                                                                exit 1
                                                                                                                                                                                                                                                                                                                                                                                
