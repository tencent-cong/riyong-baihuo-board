{"name":"Refresh creative frames","permissions":{"contents":"write"},"jobs":{"generate":{"runs-on":"ubuntu-latest","timeout-minutes":20,"concurrency":{"group":"frame-generate-${{ github.event.inputs.track_name || 'all-tracks' }}","cancel-in-progress":true},"steps":[{"name":"Checkout repository","uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"name":"Ensure FFmpeg","run":"command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)"},{"name":"Generate frame manifest","env":{"TRACK_NAME":"${{ github.event.inputs.track_name || '' }}","FRAME_MAX_WORKERS":"3","FRAME_MATERIAL_TIMEOUT":"240"},"run":"python3 tools/refresh_uploaded_frames.py prepare --track \"$TRACK_NAME\" --work-dir /tmp/frame-refresh"},{"name":"Upload generated frames","uses":"actions/upload-artifact@v4","with":{"name":"frame-refresh-${{ github.run_id }}","path":"/tmp/frame-refresh","include-hidden-files":true,"retention-days":1}}]},"apply":{"needs":"generate","runs-on":"ubuntu-latest","timeout-minutes":10,"concurrency":{"group":"creative-frame-writer","cancel-in-progress":false},"steps":[{"name":"Checkout repository","uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"name":"Download generated frames","uses":"actions/download-artifact@v4","with":{"name":"frame-refresh-${{ github.run_id }}","path":"/tmp/frame-refresh"}},{"name":"Apply to latest data and push","env":{"TRACK_NAME":"${{ github.event.inputs.track_name || '' }}"},"run":"git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\nfor attempt in 1 2 3 4 5; do\n  git fetch origin main\n  git reset --hard origin/main\n  python3 tools/refresh_uploaded_frames.py apply --track \"$TRACK_NAME\" --work-dir /tmp/frame-refresh\n  if git diff --quiet -- site/data/creative.js site/assets/frames; then\n    echo \"No frame changes\"\n    exit 0\n  fi\n  git add site/data/creative.js site/assets/frames\n  git commit -m \"frames: 自动修复关键帧${TRACK_NAME:+「$TRACK_NAME」}\"\n  if git push origin HEAD:main; then\n    exit 0\n  fi\n  sleep $((attempt * 3))\ndone\nexit 1\n"}]}},"on":{"workflow_dispatch":{"inputs":{"track_name":{"description":"Track name to refresh; empty means all tracks","required":false,"default":"","type":"string"}}},"schedule":[{"cron":"7,22,37,52 * * * *"}]}}
